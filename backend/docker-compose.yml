version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/root/.ollama/models
    environment:
      - OLLAMA_NUM_GPU=1
      - OLLAMA_GPU_OVERHEAD=4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    runtime: nvidia
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ../projects:/app/projects
      - ../qdrant_data:/app/qdrant_data
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LOG_LEVEL=INFO
      - PROJECT_ROOT=/app/projects
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build: ../frontend
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
